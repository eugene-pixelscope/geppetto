apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: geppetto-agent-execution
  namespace: geppetto-agent
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - create
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
- apiGroups: ['']
  resources: [services]
  verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: geppetto-agent-execution
  namespace: geppetto-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: geppetto-agent-execution
subjects:
- kind: ServiceAccount
  name: geppetto-agent
  namespace: geppetto-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: geppetto-agent-execution
  namespace: geppetto-agent
data:
