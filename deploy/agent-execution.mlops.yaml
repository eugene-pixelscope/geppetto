    "localhost:5001/geppetto-ball@sha256:bc83b58c4882a73845d14cf4c28bfb1cb23a2e384f9fc2029f16cd5ecb4ed75c",
    "localhost:5001/geppetto-ball@sha256:8925a20f12aa8a59781f3ed844fd21e2a736eb4b2211a8ecd427313d6557858b"],
